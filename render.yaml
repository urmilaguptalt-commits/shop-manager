services:
  - type: web
    name: shop-manager-backend
    env: python
    rootDir: shop-manager
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: "" # Leave empty to use default SQLite, or paste a Neon.tech connection string
      - key: JWT_SECRET
        generateValue: true
